name: Refresh KnowHow content

on:
  schedule:
    # Runs at 03:00 UTC on the 1st of every month. Change the cron expression
    # to adjust cadence (e.g. "0 3 * * 1" = every Monday).
    - cron: "0 3 1 * *"
  workflow_dispatch: {}
    # Lets you trigger a refresh manually from the Actions tab —
    # use this to test the whole pipeline before trusting the schedule.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run content refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_content.py

      - name: Commit and push if changed
        run: |
          git config user.name "knowhow-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes — index.html already accurate."
          else
            git add index.html
            git commit -m "Automated content refresh $(date -u +%Y-%m-%d)"
            git push
          fi
